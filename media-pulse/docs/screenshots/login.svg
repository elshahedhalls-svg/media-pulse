<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Card -->
  <rect x="100" y="50" width="200" height="200" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="170" y="65" width="60" height="24" rx="4" fill="#3b82f6"/>
  <text x="200" y="81" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Media Pulse</text>
  
  <!-- Title -->
  <text x="200" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Login</text>
  
  <!-- Username Label -->
  <text x="120" y="130" font-size="11" fill="#64748b">Username</text>
  
  <!-- Username Input -->
  <rect x="120" y="135" width="160" height="28" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="130" y="153" font-size="11" fill="#94a3b8">admin1</text>
  
  <!-- Password Label -->
  <text x="120" y="175" font-size="11" fill="#64748b">Password</text>
  
  <!-- Password Input -->
  <rect x="120" y="180" width="160" height="28" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="130" y="198" font-size="11" fill="#94a3b8">••••••••</text>
  
  <!-- Login Button -->
  <rect x="120" y="220" width="160" height="32" rx="6" fill="#3b82f6"/>
  <text x="200" y="240" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Login</text>
  
  <!-- Demo Info -->
  <rect x="120" y="260" width="160" height="24" rx="4" fill="#f1f5f9"/>
  <text x="200" y="276" text-anchor="middle" font-size="9" fill="#64748b">admin1 / Admin123!</text>
</svg>
