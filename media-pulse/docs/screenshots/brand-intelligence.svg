<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect width="600" height="50" fill="#1e293b"/>
  <rect x="20" y="15" width="24" height="20" rx="4" fill="#3b82f6"/>
  <text x="50" y="30" fill="white" font-size="14" font-weight="bold">Media Pulse</text>
  
  <!-- Tabs -->
  <rect x="0" y="50" width="600" height="40" fill="#334155"/>
  <rect x="240" y="50" width="120" height="40" fill="#6366f1"/>
  <text x="300" y="75" text-anchor="middle" fill="white" font-size="11">Brand Intel</text>
  
  <!-- Sub Tabs -->
  <rect x="20" y="100" width="560" height="35" rx="6" fill="#f1f5f9"/>
  <rect x="22" y="102" width="80" height="31" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="62" y="122" text-anchor="middle" font-size="10">Overview</text>
  <text x="150" y="122" text-anchor="middle" font-size="10" fill="#64748b">Mentions</text>
  <text x="250" y="122" text-anchor="middle" font-size="10" fill="#64748b">Sources</text>
  <text x="340" y="122" text-anchor="middle" font-size="10" fill="#64748b">Trend</text>
  
  <!-- Sentiment Card -->
  <rect x="20" y="150" width="180" height="100" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="110" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="#22c55e">+0.45</text>
  <text x="110" y="205" text-anchor="middle" font-size="11" fill="#64748b">Sentiment Score</text>
  <text x="110" y="235" text-anchor="middle" font-size="10" fill="#22c55e">Positive</text>
  
  <!-- Mentions Card -->
  <rect x="210" y="150" width="180" height="100" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="300" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="#3b82f6">156</text>
  <text x="300" y="205" text-anchor="middle" font-size="11" fill="#64748b">Total Mentions</text>
  <text x="300" y="235" text-anchor="middle" font-size="10" fill="#22c55e">+23 this week</text>
  
  <!-- Sources Card -->
  <rect x="400" y="150" width="180" height="100" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="180" text-anchor="middle" font-size="28" font-weight="bold" fill="#8b5cf6">7</text>
  <text x="490" y="205" text-anchor="middle" font-size="11" fill="#64748b">Data Sources</text>
  <text x="490" y="235" text-anchor="middle" font-size="10" fill="#94a3b8">Twitter, Reddit, News...</text>
  
  <!-- Sentiment Breakdown -->
  <rect x="20" y="265" width="280" height="120" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="285" font-size="11" font-weight="bold" fill="#1e293b">Sentiment Breakdown</text>
  
  <rect x="30" y="295" width="20" height="20" rx="4" fill="#22c55e"/>
  <text x="55" y="310" font-size="10" fill="#64748b">Positive: 89 (57%)</text>
  
  <rect x="30" y="320" width="20" height="20" rx="4" fill="#f59e0b"/>
  <text x="55" y="335" font-size="10" fill="#64748b">Neutral: 42 (27%)</text>
  
  <rect x="30" y="345" width="20" height="20" rx="4" fill="#ef4444"/>
  <text x="55" y="360" font-size="10" fill="#64748b">Negative: 25 (16%)</text>
  
  <!-- Trend Chart -->
  <rect x="310" y="265" width="270" height="120" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="285" font-size="11" font-weight="bold" fill="#1e293b">7-Day Trend</text>
  <polyline points="330,360 360,350 390,345 420,340 450,335 480,330 510,325 540,320" 
            fill="none" stroke="#6366f1" stroke-width="2"/>
  <circle cx="330" cy="360" r="3" fill="#6366f1"/>
  <circle cx="390" cy="345" r="3" fill="#6366f1"/>
  <circle cx="450" cy="335" r="3" fill="#6366f1"/>
  <circle cx="510" cy="325" r="3" fill="#6366f1"/>
  
  <!-- Source Icons -->
  <text x="340" y="375" font-size="9" fill="#94a3b8">Mon Tue Wed Thu Fri Sat Sun</text>
</svg>
