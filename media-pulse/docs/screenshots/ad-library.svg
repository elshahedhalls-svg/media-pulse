<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect width="600" height="50" fill="#1e293b"/>
  <rect x="20" y="15" width="24" height="20" rx="4" fill="#3b82f6"/>
  <text x="50" y="30" fill="white" font-size="14" font-weight="bold">Media Pulse</text>
  
  <!-- Tabs -->
  <rect x="0" y="50" width="600" height="40" fill="#334155"/>
  <rect x="0" y="50" width="120" height="40" fill="#3b82f6"/>
  <text x="60" y="75" text-anchor="middle" fill="white" font-size="11">Meta Ads</text>
  <text x="180" y="75" text-anchor="middle" fill="#94a3b8" font-size="11">App Tracking</text>
  <text x="300" y="75" text-anchor="middle" fill="#94a3b8" font-size="11">Brand Intel</text>
  <text x="420" y="75" text-anchor="middle" fill="#94a3b8" font-size="11">TikTok</text>
  
  <!-- Search Bar -->
  <rect x="20" y="105" width="300" height="36" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="127" font-size="12" fill="#94a3b8">Search brand or category...</text>
  
  <!-- Filter -->
  <rect x="330" y="105" width="100" height="36" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="127" text-anchor="middle" font-size="11" fill="#64748b">EG, SA ▼</text>
  
  <!-- Update Button -->
  <rect x="440" y="105" width="100" height="36" rx="6" fill="#3b82f6"/>
  <text x="490" y="127" text-anchor="middle" fill="white" font-size="11">Update Now</text>
  
  <!-- Export Button -->
  <rect x="550" y="105" width="40" height="36" rx="6" fill="#22c55e"/>
  <text x="570" y="127" text-anchor="middle" fill="white" font-size="10">Excel</text>
  
  <!-- Ad Card 1 -->
  <rect x="20" y="155" width="280" height="120" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="155" width="280" height="28" rx="8" fill="#f1f5f9"/>
  <text x="30" y="173" font-size="11" font-weight="bold" fill="#1e293b">Vodafone Egypt</text>
  <rect x="240" y="160" width="50" height="18" rx="4" fill="#22c55e"/>
  <text x="265" y="173" text-anchor="middle" fill="white" font-size="9">Active</text>
  <text x="30" y="200" font-size="11" fill="#64748b">Creative: "アー" - كلام عربي</text>
  <text x="30" y="218" font-size="10" fill="#94a3b8">Platforms: Facebook, Instagram</text>
  <text x="30" y="236" font-size="10" fill="#94a3b8">Spend: $1,250 | Impressions: 833K</text>
  <text x="30" y="254" font-size="10" fill="#94a3b8">Duration: 30 days | Countries: EG</text>
  
  <!-- Ad Card 2 -->
  <rect x="310" y="155" width="280" height="120" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="310" y="155" width="280" height="28" rx="8" fill="#f1f5f9"/>
  <text x="320" y="173" font-size="11" font-weight="bold" fill="#1e293b">Etisalat UAE</text>
  <rect x="530" y="160" width="50" height="18" rx="4" fill="#22c55e"/>
  <text x="555" y="173" text-anchor="middle" fill="white" font-size="9">Active</text>
  <text x="320" y="200" font-size="11" fill="#64748b">Creative: "최고의 네트워크"</text>
  <text x="320" y="218" font-size="10" fill="#94a3b8">Platforms: Facebook, Messenger</text>
  <text x="320" y="236" font-size="10" fill="#94a3b8">Spend: $3,500 | Impressions: 1.2M</text>
  <text x="320" y="254" font-size="10" fill="#94a3b8">Duration: 45 days | Countries: AE, SA</text>
  
  <!-- Stats -->
  <rect x="20" y="290" width="130" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="85" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#3b82f6">24</text>
  <text x="85" y="345" text-anchor="middle" font-size="10" fill="#64748b">Total Ads</text>
  
  <rect x="160" y="290" width="130" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="225" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#22c55e">18</text>
  <text x="225" y="345" text-anchor="middle" font-size="10" fill="#64748b">Active</text>
  
  <rect x="300" y="290" width="130" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="365" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#f59e0b">$45K</text>
  <text x="365" y="345" text-anchor="middle" font-size="10" fill="#64748b">Total Spend</text>
  
  <rect x="440" y="290" width="150" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="515" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#8b5cf6">8.2M</text>
  <text x="515" y="345" text-anchor="middle" font-size="10" fill="#64748b">Impressions</text>
</svg>
